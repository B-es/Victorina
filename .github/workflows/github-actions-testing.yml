name: Testing the ASP.NET code

on:
  push:
    branches:
      - base

jobs:
  build:
    
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: [ '8.0.x' ]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup .NET Core SDK ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
          
      - name: Install dependencies
        run: |
          dotnet restore VictorinaBase/VictorinaBase.sln
          
      - name: Build
        run: |
          dotnet build VictorinaBase/VictorinaBase.sln --configuration Release --no-restore
          
      - name: Run tests
        run: |
          dotnet test VictorinaBase/VictorinaBase.sln --configuration Release --no-build --verbosity normal